name: Publicar reglas Firebase

# Publica firestore.rules en Firebase cada vez que cambian (o a mano desde Actions).
# Requiere el secreto FIREBASE_SERVICE_ACCOUNT (JSON de la cuenta de servicio).
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'firestore.rules', 'firebase.json', '.github/workflows/firebase-rules.yml' ]

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verificar secreto
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Falta el secreto FIREBASE_SERVICE_ACCOUNT (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - name: Publicar reglas de Firestore
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13 deploy --only firestore:rules --project kevanix-88f77 --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
