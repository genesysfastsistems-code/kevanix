    <div class="card" style="padding:8px">
      <img src="${it.dataUrl}" style="width:100%;height:130px;object-fit:cover;border-radius:10px;cursor:pointer" onclick="iniGalView('${alId}','${it.id}')">
      <div style="font-size:12.5px;font-weight:600;margin-top:6px">${it.titulo||(it.tipo==='trabajo'?'Trabajo':'Foto')}</div>
      <div class="muted" style="font-size:11px">${fmtFecha(it.fecha)}</div>
      <div style="display:flex;gap:6px;margin-top:6px">
        <button class="btn sm" style="flex:1" onclick="iniGalDownload('${alId}','${it.id}')">⬇ Descargar</button>
        ${staff?`<button class="btn sm bad" onclick="iniGalDel('${alId}','${it.id}')">🗑</button>`:''}
      </div>
    </div>`).join('')}</div>`;
}
function modalIniGal(alId){
  window._iniGalTmp=null;
  modal(`<div class="modal-head"><h2>Subir foto / trabajo</h2><button class="iconbtn" style="background:#eef2ff;color:var(--brand)" onclick="closeModal()">✕</button></div>
    <div class="center" style="margin-bottom:12px">
      <div id="iniGalPrev" onclick="document.getElementById('iniGalFile').click()" style="width:160px;height:160px;border-radius:14px;margin:0 auto;background:#eef2ff;display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--brand);border:2px dashed #c7d2fe;cursor:pointer;overflow:hidden;background-size:cover;background-position:center">📷</div>
      <div class="muted" style="font-size:12px;margin-top:6px">Tocá para elegir la imagen</div>
      <input id="iniGalFile" type="file" accept="image/*" style="display:none" onchange="pickIniGal(this)">
    </div>
    <div class="field"><label>Título</label><input id="iniGalTit" placeholder="Ej: Dibujo de la familia"></div>
    <div class="field"><label>Tipo</label><select id="iniGalTipo"><option value="foto">Foto</option><option value="trabajo">Trabajo</option></select></div>
    <button class="btn" onclick="guardarIniGal('${alId}')">Guardar</button>`);
}
function pickIniGal(inp){readImage(inp.files[0],1100,d=>{if(!d)return toast('No se pudo leer la imagen');window._iniGalTmp=d;const p=document.getElementById('iniGalPrev');p.style.backgroundImage="url('"+d+"')";p.textContent='';},0.6);}
async function guardarIniGal(alId){
  if(!window._iniGalTmp)return toast('Elegí una imagen');
  const items=await iniGalLoad(alId);
  const it={id:uid('g'),tipo:val('iniGalTipo')||'foto',titulo:val('iniGalTit'),dataUrl:window._iniGalTmp,fecha:hoy(),autor:(session&&session.nombre)||''};
  const approx=items.reduce((s,x)=>s+(x.dataUrl?x.dataUrl.length:0),0)+it.dataUrl.length;
  if(approx>1000000)return toast('⚠️ Galería llena para este alumno. Borrá una imagen antes de subir otra.');
  items.unshift(it);await iniGalSave(alId,items);window._iniGalTmp=null;closeModal();toast('Imagen agregada');iniGalRender(alId);
}
function iniGalView(alId,itId){const it=(_iniGalCache[alId]||[]).find(x=>x.id===itId);if(!it)return;
  modal(`<div class="modal-head"><h2 style="font-size:16px">${it.titulo||(it.tipo==='trabajo'?'Trabajo':'Foto')}</h2><button class="iconbtn" style="background:#eef2ff;color:var(--brand)" onclick="closeModal()">✕</button></div>
    <img src="${it.dataUrl}" style="width:100%;border-radius:12px">
    <div class="muted" style="font-size:12px;margin-top:6px">${fmtFecha(it.fecha)}${it.autor?' · '+it.autor:''}</div>
    <div style="height:10px"></div><button class="btn" onclick="iniGalDownload('${alId}','${itId}')">⬇ Descargar imagen</button>`);
}
function iniGalDownload(alId,itId){const it=(_iniGalCache[alId]||[]).find(x=>x.id===itId);if(!it)return;
  const a=iniAlumno(alId);const base=((a&&a.nombre)||'imagen').replace(/[^a-z0-9]+/gi,'_');
  const name=base+'_'+(it.titulo?it.titulo.replace(/[^a-z0-9]+/gi,'_'):it.tipo)+'.jpg';
  try{ if(window.AndroidPDF&&window.AndroidPDF.save&&it.dataUrl.indexOf('data:image/jpeg')===0){window.AndroidPDF.save(name,it.dataUrl.split(',')[1]);toast('Guardado en Descargas');return;} }catch(e){}
  const el=document.createElement('a');el.href=it.dataUrl;el.download=name;document.body.appendChild(el);el.click();setTimeout(()=>el.remove(),1200);
}
async function iniGalDel(alId,itId){let items=await iniGalLoad(alId);items=items.filter(x=>x.id!==itId);await iniGalSave(alId,items);toast('Imagen eliminada');iniGalRender(alId);}

/* ---- PERSONAL del Inicial (maestra / ayudante) ---- */
function iniDocentes(el){
  head('Nivel Inicial','Personal');
  const ds=q('iniDocentes');
  el.innerHTML=`
    <button class="btn sec" style="margin-bottom:12px" onclick="go('iniHome')">← Nivel Inicial</button>
    <div class="pagetitle">Maestras y ayudantes (${ds.length})</div>
    <div class="list">${ds.map(d=>`<div class="li" onclick="modalIniDocente('${d.id}')"><div class="av">👩‍🏫</div><div class="tx"><b>${d.nombre}</b><small>${d.rolIni||'Maestra'}${d.sala?' · '+d.sala:''}${d.telefono?' · '+d.telefono:''}</small></div><span class="pill">Editar</span></div>`).join('')||empty('Sin personal cargado','Agregá con el botón +')}</div>
    <button class="fab" onclick="modalIniDocente()">+</button>`;
}
function modalIniDocente(id){
  const d=id?DB.iniDocentes.find(x=>x.id===id):{};
  const g=k=>d[k]!=null?String(d[k]).replace(/"/g,'&quot;'):'';
  modal(`<div class="modal-head"><h2>${id?'Editar personal':'Nuevo personal · Inicial'}</h2><button class="iconbtn" style="background:#eef2ff;color:var(--brand)" onclick="closeModal()">✕</button></div>
    <div class="field"><label>Nombre completo</label><input id="id_nombre" value="${g('nombre')}"></div>
    <div class="row"><div class="field"><label>Rol</label><select id="id_rol">${['Maestra','Ayudante','Directora'].map(o=>`<option ${d.rolIni===o?'selected':''}>${o}</option>`).join('')}</select></div>
      <div class="field"><label>Sala</label><select id="id_sala"><option value=""></option>${INICIAL_SALAS.map(s=>`<option ${d.sala===s?'selected':''}>${s}</option>`).join('')}</select></div></div>
    <div class="row"><div class="field"><label>Teléfono</label><input id="id_tel" value="${g('telefono')}"></div><div class="field"><label>Correo</label><input id="id_mail" value="${g('correo')}"></div></div>
    <div class="field"><label>Especialidad / Título</label><input id="id_esp" value="${g('especialidad')}"></div>
    <div style="height:10px"></div>
    <div style="display:flex;gap:8px">
      <button class="btn" style="flex:1" onclick="guardarIniDocente('${id||''}')">Guardar</button>
      ${id?`<button class="btn bad" onclick="borrarIniDocente('${id}')">Eliminar</button>`:''}
    </div>`);
}
function guardarIniDocente(id){
  const n=val('id_nombre');if(!n)return toast('Ingresá el nombre');
  const d={nombre:n,rolIni:val('id_rol'),sala:val('id_sala'),telefono:val('id_tel'),correo:val('id_mail'),especialidad:val('id_esp')};
  if(id){Object.assign(DB.iniDocentes.find(x=>x.id===id),d);}else DB.iniDocentes.push({id:uid('im'),colegioId:cid(),...d});
  save();closeModal();toast('Guardado');go('iniDocentes');
}
function borrarIniDocente(id){DB.iniDocentes=DB.iniDocentes.filter(x=>x.id!==id);save();closeModal();toast('Eliminado');go('iniDocentes');}

/* ---- LIBRETA (evaluación MEC cualitativa) ---- */
function iniLibreta(el){
  const a=iniAlumno(window._iniAl);
  if(!a){el.innerHTML='<div class="pagetitle">Alumno no encontrado</div>';return;}
  const staff=esStaffIni();
  const per=window._iniPer||INICIAL_PERIODOS[0];
  const lib=iniLibretaGet(a.id,per)||{valores:{},observacion:''};
  head('Libreta MEC',a.nombre);
  el.innerHTML=`
    <button class="btn sec" style="margin-bottom:12px" onclick="verIniAlumno('${a.id}')">← Perfil</button>
    <div class="pagetitle">Libreta de Evaluación · Inicial</div>
    <div class="card"><b>${a.nombre}</b> · ${a.sala||''}${a.edad?' · '+a.edad+' años':''}</div>
    <div class="field"><label>Período</label><select id="lib_per" onchange="window._iniPer=this.value;go('iniLibreta')">${INICIAL_PERIODOS.map(p=>`<option ${per===p?'selected':''}>${p}</option>`).join('')}</select></div>
    <div class="card" style="font-size:12.5px;background:#f1f5ff"><b>Escala MEC:</b> A = Adquirido · EP = En proceso · I = Iniciado</div>
    ${INICIAL_MEC.map(sec=>`
      <div class="sectionlabel">${sec.area}</div>
      <div class="list">${sec.inds.map(ind=>{const cur=lib.valores[sec.area+'|'+ind]||'';
        return `<div class="card" style="padding:10px 12px">
          <div style="font-size:13px;margin-bottom:6px">${ind}</div>
          ${staff?`<select class="libSel" data-key="${(sec.area+'|'+ind).replace(/"/g,'&quot;')}"><option value="">— Sin evaluar —</option>${INICIAL_ESCALA.map(e=>`<option value="${e.k}" ${cur===e.k?'selected':''}>${e.k} · ${e.t}</option>`).join('')}</select>`:`<span class="pill ${cur==='A'?'ok':(cur==='I'?'bad':'')}">${cur?cur+' · '+iniEscalaTxt(cur):'Sin evaluar'}</span>`}
        </div>`;}).join('')}</div>`).join('')}
    <div class="sectionlabel">Observaciones del período</div>
    ${staff?`<textarea id="lib_obs" rows="3">${(lib.observacion||'').replace(/</g,'&lt;')}</textarea>
      <div style="height:10px"></div><button class="btn" onclick="guardarIniLibreta('${a.id}')">Guardar libreta</button>`:`<div class="card">${lib.observacion||'Sin observaciones.'}</div>`}
    <div style="height:10px"></div>
    <button class="btn sec" onclick="pdfLibretaInicial('${a.id}')">📄 Descargar libreta en PDF</button>`;
}
function guardarIniLibreta(alId){
  const per=window._iniPer||INICIAL_PERIODOS[0];
  const valores={};
  document.querySelectorAll('.libSel').forEach(s=>{const k=s.getAttribute('data-key');if(s.value)valores[k]=s.value;});
  const obs=(document.getElementById('lib_obs')||{}).value||'';
  let lib=iniLibretaGet(alId,per);
  if(lib){lib.valores=valores;lib.observacion=obs;lib.fecha=hoy();lib.autor=(session&&session.nombre)||'';}
  else DB.iniLibreta.push({id:uid('il'),colegioId:cid(),alumnoId:alId,periodo:per,valores,observacion:obs,fecha:hoy(),autor:(session&&session.nombre)||''});
  save();toast('Libreta guardada');
}
function iniWrap(txt,max){const words=String(txt).split(/\s+/);const lines=[];let ln='';words.forEach(w=>{if((ln+' '+w).trim().length>max){lines.push(ln.trim());ln=w;}else ln=(ln+' '+w).trim();});if(ln)lines.push(ln);return lines.length?lines:[''];}
function pdfLibretaInicial(alId){
  const a=iniAlumno(alId);if(!a)return;
  const per=window._iniPer||INICIAL_PERIODOS[0];
  const lib=iniLibretaGet(a.id,per)||{valores:{},observacion:''};
  const c=colegio();
  const doc=makeDoc(false);
  doc.setFillColor(10,14,46);doc.rect(0,0,210,26,'F');
  let tx=14;
  if(c&&c.logo){try{doc.setFillColor(255,255,255);doc.rect(12,4,18,18,'F');doc.addImageJPEG(c.logo,13,5,16,16);tx=34;}catch(e){}}
  doc.setTextColor(255);doc.setFont(undefined,'bold');doc.setFontSize(14);doc.text((c?c.nombre:'KEVANIX').slice(0,42),tx,11);
  doc.setFont(undefined,'normal');doc.setFontSize(10);doc.text('Libreta de Evaluacion - Nivel Inicial (MEC)',tx,19);
  doc.setTextColor(0);
  let y=35;
  doc.setFont(undefined,'bold');doc.setFontSize(11);doc.text('Alumno/a: '+a.nombre,14,y);
  doc.setFont(undefined,'normal');doc.setFontSize(10);
  doc.text('Sala: '+(a.sala||'-')+'     Edad: '+(a.edad||'-')+' anios     Periodo: '+per,14,y+6);
  y+=13;doc.setDrawColor(180,190,210);doc.line(14,y,196,y);
  doc.setFontSize(9);doc.setTextColor(90,100,130);doc.text('Escala: A = Adquirido    EP = En proceso    I = Iniciado',14,y+5);doc.setTextColor(0);y+=11;
  INICIAL_MEC.forEach(sec=>{
    doc.setFillColor(232,236,248);doc.rect(14,y-4,182,7,'F');
    doc.setFont(undefined,'bold');doc.setFontSize(9.5);doc.text(sec.area,16,y+1);y+=8.5;
    doc.setFont(undefined,'normal');doc.setFontSize(9);
    sec.inds.forEach(ind=>{
      const v=lib.valores[sec.area+'|'+ind]||'-';
      doc.text('- '+ind,17,y);
      doc.setFont(undefined,'bold');doc.text(v,188,y);doc.setFont(undefined,'normal');
      y+=5.6;
    });
    y+=2.5;
  });
  y+=2;doc.setFont(undefined,'bold');doc.setFontSize(10);doc.text('Observaciones:',14,y);y+=6;
  doc.setFont(undefined,'normal');doc.setFontSize(9.5);
  iniWrap(lib.observacion||'Sin observaciones.',95).forEach(line=>{doc.text(line,14,y);y+=5;});
  y=Math.max(y+12,262);
  doc.setDrawColor(120,130,160);doc.line(28,y,88,y);doc.line(122,y,182,y);
  doc.setFontSize(9);doc.text('Maestra',48,y+5);doc.text('Firma del encargado/a',132,y+5);
  doc.save('Libreta_Inicial_'+a.nombre.replace(/[^a-z0-9]+/gi,'_')+'.pdf');
}

function val(id){const e=document.getElementById(id);return e?e.value.trim():'';}
function empty(t,s){return `<div class="empty"><div class="ic">📭</div><div style="font-weight:600;margin-top:6px">${t}</div>${s?`<div style="font-size:13px">${s}</div>`:''}</div>`;}
function modal(html){closeModal();const bg=document.createElement('div');bg.className='modal-bg';bg.id='modalBg';
  bg.innerHTML=`<div class="modal" onclick="event.stopPropagation()">${html}</div>`;
  bg.onclick=closeModal;document.body.appendChild(bg);}
function closeModal(){const m=document.getElementById('modalBg');if(m)m.remove();}

document.getElementById('lgPass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

else { cloudError('No se pudo cargar Firebase (¿sin internet?).'); }
