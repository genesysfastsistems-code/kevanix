<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1e3a8a">
<title>KEVANIX — Sistema Educativo</title>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#1e3a8a; --brand2:#2563eb; --accent:#0ea5e9;
  --ok:#16a34a; --warn:#f59e0b; --bad:#dc2626;
  --bg:#f1f5f9; --card:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --radius:16px; --shadow:0 2px 12px rgba(15,23,42,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
img{max-width:100%}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:15px;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 5px 2px}
.field{margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--brand2);color:#fff;font-weight:600;padding:12px 16px;border-radius:12px;font-size:15px;transition:.15s;width:100%}
.btn:active{transform:scale(.98)}
.btn.sec{background:#eef2ff;color:var(--brand)}
.btn.ok{background:var(--ok)}
.btn.bad{background:var(--bad)}
.btn.warn{background:var(--warn);color:#7c2d12}
.btn.ghost{background:transparent;color:var(--brand2);border:1px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:13px;width:auto}
.row{display:flex;gap:10px}
.row>*{flex:1}
.hide{display:none!important}
.center{text-align:center}
.muted{color:var(--muted)}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700}
.pill.ok{background:#dcfce7;color:#166534}.pill.bad{background:#fee2e2;color:#991b1b}
.pill.warn{background:#fef3c7;color:#92400e}.pill.info{background:#dbeafe;color:#1e40af}
.pill.gray{background:#e2e8f0;color:#475569}

/* LOGIN */
#login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:26px;background:linear-gradient(160deg,#1e3a8a,#2563eb 60%,#0ea5e9)}
#login .card{background:#fff;border-radius:22px;padding:26px 22px;box-shadow:0 20px 50px rgba(0,0,0,.28);max-width:420px;margin:0 auto;width:100%}
.logo{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,var(--brand),var(--accent));display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 12px;box-shadow:var(--shadow)}
.brandname{text-align:center;font-weight:800;font-size:23px;letter-spacing:-.5px}
.brandsub{text-align:center;color:var(--muted);margin:2px 0 20px;font-size:13px}
.demo-users{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.demo-users .du{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;font-size:13px}
.demo-users .du b{font-size:13px}

/* APP SHELL */
#app{display:none;min-height:100vh;padding-bottom:74px}
.topbar{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.topbar .tlogo{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:18px}
.topbar h1{font-size:16px;margin:0;font-weight:700}
.topbar .sub{font-size:11px;opacity:.85;margin-top:1px}
.topbar .spacer{flex:1}
.iconbtn{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.14);color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center}
.content{padding:16px;max-width:760px;margin:0 auto}
.pagetitle{font-size:20px;font-weight:800;margin:2px 0 14px;letter-spacing:-.4px}

/* CARDS / GRID */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px}
.stat .n{font-size:26px;font-weight:800;letter-spacing:-1px;line-height:1}
.stat .l{font-size:12px;color:var(--muted);margin-top:5px;font-weight:600}
.stat .ico{font-size:20px;margin-bottom:6px;display:block}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mtile{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 14px;text-align:left;transition:.15s}
.mtile:active{transform:scale(.97)}
.mtile .ic{font-size:24px}
.mtile .tt{font-weight:700;margin-top:8px;font-size:14px}
.mtile .ds{font-size:11.5px;color:var(--muted);margin-top:2px}

/* LIST */
.list{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:none}
.li .av{width:40px;height:40px;border-radius:11px;background:#eef2ff;color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0}
.li .tx{flex:1;min-width:0}
.li .tx b{font-size:14.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .tx small{color:var(--muted);font-size:12px}
.li .rt{text-align:right;flex-shrink:0}

/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;padding:8px 8px;border-bottom:2px solid var(--line)}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* BOTTOM NAV */
.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 4px 8px;box-shadow:0 -2px 12px rgba(0,0,0,.06)}
.bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:600;padding:4px 2px}
.bottomnav button .bi{font-size:20px}
.bottomnav button.active{color:var(--brand2)}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal{background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;padding:20px;animation:slideup .25s}
@keyframes slideup{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.modal h2{margin:0 0 4px;font-size:18px}
.modal .close{position:absolute}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.chip{display:inline-block;padding:6px 12px;border-radius:999px;background:#eef2ff;color:var(--brand);font-size:12.5px;font-weight:600;margin:0 6px 6px 0;border:1px solid transparent}
.chip.active{background:var(--brand2);color:#fff}
.sectionlabel{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:18px 2px 8px}
.empty{text-align:center;color:var(--muted);padding:30px 16px}
.empty .ic{font-size:38px;opacity:.4}
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 20px;border-radius:999px;font-size:13.5px;z-index:100;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:slideup .2s}
.fab{position:fixed;bottom:88px;right:16px;width:56px;height:56px;border-radius:18px;background:var(--brand2);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(37,99,235,.4);z-index:25}
.hr{height:1px;background:var(--line);margin:14px 0}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border:none}
.kv span{color:var(--muted)}.kv b{font-weight:700}
.bar{height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--brand2);border-radius:999px}
.seg{display:flex;background:#eef2ff;border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:8px;border-radius:9px;font-size:13px;font-weight:600;color:var(--brand)}
.seg button.active{background:#fff;color:var(--brand2);box-shadow:var(--shadow)}
.badge{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#ef4444;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;border:1.5px solid #0a0e2e}
.notif{padding:11px 2px;border-bottom:1px solid var(--line)}
.notif:last-child{border:none}
.notif .nt{font-weight:700;font-size:14px}
.notif .nd{font-size:13px;color:#334155;margin-top:2px}
.notif .ntime{font-size:11px;color:var(--muted);margin-top:3px}
.avlabel{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;margin-bottom:4px}
.avlabel.inst{background:#dbeafe;color:#1e40af}
.avlabel.doc{background:#dcfce7;color:#166534}
.filechip{display:inline-flex;align-items:center;gap:5px;background:#eef2ff;color:var(--brand);font-size:12px;font-weight:600;padding:5px 10px;border-radius:9px;margin:4px 6px 0 0;text-decoration:none}

/* ================= TEMA MODERNO (KEVANIX) ================= */
:root{
  --brand:#1e2a5e; --brand2:#3b5bfd; --accent:#22d3ee;
  --bg:#eef1f8; --line:#e6eaf3;
  --radius:20px;
  --shadow:0 6px 22px rgba(20,28,70,.07), 0 1px 3px rgba(20,28,70,.05);
}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;letter-spacing:-.011em;background:
  radial-gradient(1200px 400px at 100% -10%, rgba(59,91,253,.06), transparent 60%),
  radial-gradient(900px 500px at -10% 0%, rgba(34,211,238,.06), transparent 55%), var(--bg)}
h1,h2,h3,.pagetitle,.brandname,.stat .n{font-family:'Plus Jakarta Sans','Inter',sans-serif}
.pagetitle{font-size:22px;font-weight:800;letter-spacing:-.6px}

/* Topbar con degradado */
.topbar{background:linear-gradient(120deg,#0e1330 0%,#1e2a5e 55%,#3b5bfd 130%);padding:15px 16px}
.topbar h1{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800}
.tlogo{border-radius:12px!important}

/* Botones */
.btn{border-radius:14px;font-weight:650;letter-spacing:.1px}
.btn:not(.sec):not(.ok):not(.bad):not(.warn):not(.ghost){background:linear-gradient(135deg,#3b5bfd,#2540d8);box-shadow:0 8px 18px rgba(59,91,253,.26)}
.btn.sec{background:#eef2ff;color:#2540d8}
.btn.ok{background:linear-gradient(135deg,#16a34a,#12833d)}
.btn.bad{background:linear-gradient(135deg,#ef4444,#dc2626)}
.btn:active{transform:translateY(1px) scale(.99)}

/* Tarjetas y listas */
.card,.stat,.list,.mtile{border:1px solid #edf0f8}
.card{border-radius:20px}
.mtile{border-radius:18px;transition:transform .15s,box-shadow .15s}
.mtile:active{transform:translateY(1px) scale(.98);box-shadow:0 2px 8px rgba(20,28,70,.08)}
.mtile .ic{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#eef2ff,#dfe6ff);font-size:23px;box-shadow:inset 0 0 0 1px rgba(59,91,253,.08)}
.stat .ico{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#eef2ff,#dfe6ff);font-size:20px;margin-bottom:9px}
.stat .n{letter-spacing:-1.3px}
.li .av{border-radius:13px}
.li{padding:14px 16px}

/* Inputs */
input,select,textarea{border-radius:13px;border-color:#e3e8f3;background:#fbfcfe}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 4px rgba(59,91,253,.12)}
label{font-weight:650;letter-spacing:.1px}

/* Nav inferior */
.bottomnav{background:rgba(255,255,255,.96);border-top:1px solid #e9edf6;box-shadow:0 -6px 20px rgba(20,28,70,.05)}
.bottomnav button{border-radius:12px;transition:.15s}
.bottomnav button.active{color:#2540d8}
.bottomnav button.active .bi{transform:translateY(-1px) scale(1.06)}

/* Detalles */
.fab{border-radius:18px;background:linear-gradient(135deg,#3b5bfd,#2540d8);box-shadow:0 12px 26px rgba(59,91,253,.42)}
.pill{border-radius:999px;letter-spacing:.2px}
.iconbtn{border-radius:12px}
.modal{border-radius:28px 28px 0 0}
.sectionlabel{letter-spacing:.7px}
.toast{background:#0e1330;border-radius:16px}
/* Iconos SVG */
.mtile .ic{color:#2540d8;font-size:0}
.stat .ico{color:#2540d8;font-size:0}
.bottomnav .bi{line-height:0;height:23px;display:flex;align-items:center;justify-content:center}
.li .av svg,.topbar .iconbtn svg{display:block}
.fab svg{width:26px;height:26px}
</style>
</head>

<!-- ================= PANTALLA DE CONEXIÓN ================= -->
<div id="bootScreen" style="position:fixed;inset:0;z-index:200;background:linear-gradient(160deg,#0a0e2e,#1e3a8a 60%,#22d3ee);display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff">
  <div style="width:74px;height:74px;border-radius:20px;background:#070b22;border:2px solid #22d3ee;display:flex;align-items:center;justify-content:center;font-size:34px;color:#22d3ee;box-shadow:0 0 30px #22d3ee66">◁</div>
  <div style="font-weight:800;font-size:22px;margin-top:16px;letter-spacing:-.5px">KEVANIX</div>
  <div style="opacity:.85;margin-top:6px;font-size:14px">Conectando a la nube…</div>
</div>

<!-- ================= LOGIN ================= -->
<div id="login" style="display:none">
  <div class="card">
    <div class="logo" id="loginLogo">🎓</div>
    <div class="brandname" id="loginBrand">KEVANIX</div>
    <div class="brandsub">Sistema Educativo</div>
    <div class="field">
      <label>Usuario</label>
      <input id="lgUser" placeholder="Tu usuario" autocomplete="off">
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input id="lgPass" type="password" placeholder="••••••" autocomplete="off">
    </div>
    <button class="btn" onclick="doLogin()">Ingresar</button>
    <div id="lgErr" class="center" style="color:var(--bad);font-size:13px;margin-top:10px;font-weight:600"></div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app">
  <div class="topbar">
    <div class="tlogo" id="tbLogo">🎓</div>
    <div>

      <div class="sub" id="tbSub"></div>
    </div>
    <div class="spacer"></div>

    <button class="iconbtn" onclick="logout()" title="Salir" style="width:auto;padding:0 12px;gap:7px;font-size:14px;font-weight:600"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg> Salir</button>
  </div>
  <div class="content" id="view"></div>
  <div class="bottomnav" id="nav"></div>
</div>

/* --------- Imágenes: comprimir a JPEG antes de guardar --------- */
function readImage(file,max,cb,quality){
  if(!file)return;quality=quality||0.72;
  const r=new FileReader();
  r.onload=e=>{const img=new Image();img.onload=()=>{
    let w=img.width,h=img.height;const s=Math.min(1,max/Math.max(w,h));
    w=Math.round(w*s);h=Math.round(h*s);
    const c=document.createElement('canvas');c.width=w;c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    try{cb(c.toDataURL('image/jpeg',quality));}catch(err){cb(e.target.result);}
  };img.onerror=()=>cb(null);img.src=e.target.result;};
  r.readAsDataURL(file);
}

async function cloudBoot(){
  try{ firebase.initializeApp(firebaseConfig); fdb=firebase.firestore(); }
  catch(e){ return cloudError('No se pudo iniciar Firebase.'); }
  try{ fst=firebase.storage(); }catch(e){ fst=null; }
  try{ await ensureSeed(); }catch(e){ console.warn('seed:',e&&e.message); }
  firebase.auth().onAuthStateChanged(async(user)=>{
    const b=document.getElementById('bootScreen'); if(b)b.style.display='none';
    if(!user){ mostrarLogin(); return; }
    let prof=null;
    try{ const d=await usersCol().doc(user.uid).get(); prof=d.exists?d.data():null; }catch(e){}
    if(!prof){ toast('Perfil no encontrado'); await firebase.auth().signOut(); mostrarLogin(); return; }
    session={uid:user.uid, ...prof};
    window._avisoShown=false;
    if(prof.rol==='superadmin')_superReal=session;
    state.colegioActivo = prof.rol==='superadmin' ? null : prof.colegioId;
    escucharRegistro();
    listenColegio(state.colegioActivo);
    document.getElementById('lgErr').textContent='';
    document.getElementById('login').style.display='none';
    document.getElementById('app').style.display='block';
    buildNav(); go('home');
  });
}

async function ensureSeed(){
  const setup=await setupRef().get();
  if(setup.exists && setup.data().authSeeded) return;
  const s=seed();
  await regRef().set({colegios:s.colegios});
  await pagosRef().set({items:s.pagosMembresia||[]});
  for(const name of COLLS_DATA){ await dataRef('col_demo',name).set({items:s[name]||[]}); }
  const sec=secApp();
  for(const u of s.usuarios){
    try{
      const cred=await sec.auth().createUserWithEmailAndPassword(emailDe(u.usuario),u.pass);
      const perfil={usuario:u.usuario.toLowerCase(),nombre:u.nombre,rol:u.rol,colegioId:u.colegioId||null};
      if(u.alumnoId)perfil.alumnoId=u.alumnoId; if(u.docenteId)perfil.docenteId=u.docenteId;
      await usersCol().doc(cred.user.uid).set(perfil);

function listenColegio(cidv){
  _dataUnsub.forEach(u=>{try{u();}catch(e){}}); _dataUnsub=[];
  COLLS_DATA.forEach(n=>{DB[n]=[];}); DB.usuarios=[];
  if(!cidv)return;
  COLLS_DATA.forEach(name=>{
    const u=dataRef(cidv,name).onSnapshot(d=>{
      DB[name]=(d.data()||{}).items||[];
      _lastJSON[cidv+'/'+name]=JSON.stringify(DB[name]);
      rerender();
    });
    _dataUnsub.push(u);
  });
  // Lista de usuarios del colegio (solo admin/dueño pueden leerla)
  if(session && (['admin','superadmin'].includes(session.rol)||session._super)){
    const uu=usersCol().where('colegioId','==',cidv).onSnapshot(s=>{
      DB.usuarios=s.docs.map(d=>({uid:d.id,...d.data()})); rerender();
    },e=>{});
    _dataUnsub.push(uu);
  }
}

async function save(){
  if(!fdb||!session)return;
  if(esReadonly()){toast('🔒 Suscripción vencida — modo solo lectura. Contactá al proveedor.');return;}
  const writes=[];
  const put=(key,ref,val)=>{const j=JSON.stringify(val);if(_lastJSON[key]!==j){_lastJSON[key]=j;writes.push(ref.set(val));}};
  if(['admin','superadmin'].includes(session.rol)||session._super) put('registry',regRef(),{colegios:DB.colegios});
  if(session.rol==='superadmin') put('pagos',pagosRef(),{items:DB.pagosMembresia||[]});
  const cidv=state.colegioActivo;
  if(cidv){ COLLS_DATA.forEach(name=>put(cidv+'/'+name,dataRef(cidv,name),{items:DB[name]||[]})); }
  try{ await Promise.all(writes); }catch(e){ console.error('save',e); toast('⚠️ Error al guardar en la nube'); }
}

function notifList(){
  const out=[];
  if(!session)return out;
  if(session.rol==='superadmin'){
    (DB.colegios||[]).forEach(c=>{
      if(!c.membresiaVence)return;
      const dias=Math.ceil((new Date(c.membresiaVence)-new Date())/86400000);
      if(dias<=20){
        out.push({t:'⏰ Membresía por vencer',
          d:`${c.nombre} · plan ${c.plan} · ${dias<0?'venció hace '+(-dias)+' día(s)':'vence en '+dias+' día(s)'}`,
          ts:c.membresiaVence, cid:c.id, kind:'venc'});
      }
    });
  }
  if(session.rol==='docente'){
    q('tareas').filter(t=>t.docenteId===session.docenteId).forEach(t=>{
      (t.entregas||[]).forEach(e=>{
        out.push({t:'📥 Tarea entregada', d:`${e.alumnoNombre||'Un alumno'} entregó "${t.titulo}"`, ts:e.fecha, kind:'entrega', id:t.id+'|'+e.alumnoId});
      });
    });
  }
  if(session.rol==='alumno'||session.rol==='familia'){
    const al=alumno(session.alumnoId); const g=al?al.grado:null;
    q('comunicados').forEach(c=>{
      out.push({t:(c.tipo==='docente'?'👩‍🏫 Aviso del Docente':'🏫 Aviso de la Institución'),
        d:c.titulo, ts:c.fecha, kind:'aviso', id:c.id});
    });
    q('tareas').filter(t=>t.grado===g).forEach(t=>{
      out.push({t:'📋 Nueva tarea', d:(t.titulo||'')+' · entrega '+fmtFecha(t.entrega), ts:t.fecha||'', kind:'tarea', id:t.id});
    });
  }
  if(session.rol==='familia'){
    q('observaciones').filter(o=>o.alumnoId===session.alumnoId).forEach(o=>{
      out.push({t:'⚠️ Observación del colegio', d:o.titulo, ts:o.fecha, kind:'obs', id:o.id});
    });
  }
  return out.sort((a,b)=>String(b.ts).localeCompare(String(a.ts)));
}
function notifKey(n){return n.kind+'|'+(n.id||n.cid||'')+'|'+n.d;}
function seenKeyName(){return 'kx_seen_'+((session&&(session.uid||session.usuario))||'x');}
function seenSet(){try{return new Set(JSON.parse(localStorage.getItem(seenKeyName())||'[]'));}catch(e){return new Set();}}
function saveSeen(s){try{localStorage.setItem(seenKeyName(),JSON.stringify([...s].slice(-200)));}catch(e){}}
function refreshBell(){
  const bell=document.getElementById('tbBell'),badge=document.getElementById('tbBadge');
  if(!bell||!session)return;
  if(!['superadmin','docente','alumno','familia'].includes(session.rol)){bell.style.display='none';return;}
  bell.style.display='';
  const list=notifList(),seen=seenSet();
  const n=list.filter(x=>!seen.has(notifKey(x))).length;
  if(badge){badge.textContent=n>9?'9+':String(n);badge.style.display=n?'flex':'none';}
}

/* ===== PLANES DE MEMBRESÍA (KEVANIX) ===== */
const PLANES={
  'Básica':{monto:80000,tipo:'mensual',feats:['Hasta 150 alumnos','Notas y asistencia','Reportes PDF','Soporte por email']},
  'Media':{monto:100000,tipo:'mensual',feats:['Hasta 400 alumnos','Notas, asistencia y finanzas','Boletas de pago PDF','Reportes por WhatsApp']},
  'Premium':{monto:200000,tipo:'mensual',feats:['Alumnos ilimitados','Todos los módulos','Nivel Inicial','Caja, matrícula y finanzas','Soporte prioritario']},
  'Pro':{monto:1500000,tipo:'unico',feats:['Todas las funciones','Pago único, sin mensualidad','Sin vencimiento','Soporte prioritario']},
  'Máximo':{monto:0,tipo:'ilimitado',feats:['Todas las funciones habilitadas','Sin costo','Sin vencimiento','Cuenta especial']},
};
const PLAN_PRECIO=Object.fromEntries(Object.entries(PLANES).map(([k,v])=>[k,v.monto]));
function planTipo(c){const nombre=(c&&c.plan)||'Básica';return (PLANES[nombre]||PLANES['Básica']).tipo;}
function planMonto(nombre){return (PLANES[nombre]||{}).monto||0;}
function colDias(c){if(!c||!c.membresiaVence)return null;const a=new Date(c.membresiaVence);a.setHours(0,0,0,0);const b=new Date();b.setHours(0,0,0,0);return Math.round((a-b)/86400000);}
function colEstado(c){
  if(!c)return 'endia';
  if(c.bloqueado)return 'bloqueado';
  const t=planTipo(c);
  if(t==='unico'||t==='ilimitado')return 'endia';
  const d=colDias(c);
  if(d==null)return 'endia';
  if(d<=0)return 'vencido';
  if(d<=5)return 'porvencer';
  return 'endia';
}
function colActivoUso(c){const e=colEstado(c);return e==='endia'||e==='porvencer';}
function estadoPill(c){const e=colEstado(c);const m={endia:['#dcfce7','#166534','En día'],porvencer:['#fef3c7','#92400e','Por vencer'],vencido:['#fee2e2','#991b1b','Vencido'],bloqueado:['#e5e7eb','#374151','Bloqueado']}[e];return `<span class="pill" style="background:${m[0]};color:${m[1]}">${m[2]}</span>`;}
function proxVence(desde,mod){const d=desde?new Date(desde):new Date();if(mod==='anual'){d.setFullYear(d.getFullYear()+1);}else{d.setMonth(d.getMonth()+1);}return d.toISOString().slice(0,10);}
/* Finanzas de suscripciones */
function pagosDe(id){return (DB.pagosMembresia||[]).filter(p=>p.colegioId===id);}
function totalPagado(id){return pagosDe(id).reduce((s,p)=>s+(p.monto||0),0);}
function ingresosMes(yy,mm){const key=String(yy)+'-'+String(mm).padStart(2,'0');return (DB.pagosMembresia||[]).filter(p=>(p.fecha||'').slice(0,7)===key).reduce((s,p)=>s+(p.monto||0),0);}
function ingresosAnio(yy){return (DB.pagosMembresia||[]).filter(p=>(p.fecha||'').slice(0,4)===String(yy)).reduce((s,p)=>s+(p.monto||0),0);}
function mrrActual(){return DB.colegios.filter(c=>colActivoUso(c)&&planTipo(c)==='mensual').reduce((s,c)=>s+planMonto(c.plan),0);}
function clientePagaTarde(c){return pagosDe(c.id).some(p=>p.atrasado)||colEstado(c)==='vencido';}
/* Modo solo lectura al vencer/bloquear (lado cliente) */
function esReadonly(){if(!session)return false;if(session.rol==='superadmin'||session._super)return false;const c=colegio();if(!c)return false;const e=colEstado(c);return e==='vencido'||e==='bloqueado';}
function subBanner(el){
  if(!session||session.rol==='superadmin'||session._super)return;
  const c=colegio();if(!c)return;
  const e=colEstado(c);let html='';
  if(e==='vencido'||e==='bloqueado'){
    html=`<div style="background:#fee2e2;border:1px solid #fca5a5;color:#991b1b;border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:13.5px;font-weight:600">🔒 ${e==='bloqueado'?'Cuenta bloqueada':'Suscripción vencida'} — modo solo lectura. Podés consultar la información, pero no modificarla. Contactá al proveedor para reactivar el servicio.</div>`;
  }else if(e==='porvencer'){
    const d=colDias(c);
    html=`<div style="background:#fef3c7;border:1px solid #fcd34d;color:#92400e;border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:13.5px;font-weight:600">⏰ Tu suscripción vence en ${d} día${d===1?'':'s'} (${fmtFecha(c.membresiaVence)}). Renovala para no perder el acceso.</div>`;

function subFiltrar(f){

  const map={vencidos:'vencido',bloqueados:'bloqueado',porvencer:'porvencer',endia:'endia'};

      <option value="mensual">1 mes — ${money(monto)}</option>

    <button class="btn ok" onclick="confirmarCobro('${id}')">Registrar pago y activar</button>`);
}
function confirmarCobro(id){
  const c=colegio(id);if(!c)return;
  const mod=val('cb_mod');const monto=(mod==='anual')?planMonto(c.plan)*10:planMonto(c.plan);
  const vigente=(c.membresiaVence&&colDias(c)>0);
  const atrasado=(colEstado(c)==='vencido');
  const nuevaVenc=val('cb_venc')||proxVence(vigente?c.membresiaVence:null,mod);
  DB.pagosMembresia=DB.pagosMembresia||[];
  const pago={id:uid('pm'),colegioId:id,fecha:hoy(),plan:c.plan,modalidad:mod,monto,tipo:atrasado?'cobro_vencido':'renovacion',atrasado};
  DB.pagosMembresia.push(pago);
  c.membresiaVence=nuevaVenc;c.activo=true;c.bloqueado=false;
  save();closeModal();toast('✅ Pago registrado · '+money(monto));pdfReciboMembresia(c,pago);go(state.view);
}

  const c=colegio(id);if(!c)return;
  modal(`<div class="modal-head"><h2>Cambiar membresía</h2><button class="iconbtn" style="background:#eef2ff;color:var(--brand)" onclick="closeModal()">✕</button></div>

function cambioInfo(){const p=val('cm_plan');const m=PLANES[p]||{};const el=document.getElementById('cm_info');if(!el)return;
  el.textContent=m.tipo==='mensual'?`Mensual ${money(m.monto)}. Vence en 1 mes desde hoy.`:m.tipo==='unico'?`Pago único ${money(m.monto)}. Sin vencimiento.`:`Plan Máximo: sin costo ni vencimiento.`;}
function guardarCambioMembresia(id){
  const c=colegio(id);if(!c)return;
  const plan=val('cm_plan');const cobrar=(document.getElementById('cm_cobrar')||{}).checked;
  c.plan=plan;const t=planTipo(c);c.bloqueado=false;c.activo=true;
  if(t==='mensual'){ if(!c.membresiaVence||colDias(c)<=0)c.membresiaVence=proxVence(null,'mensual'); }
  else { c.membresiaVence=null; }
  if(cobrar&&planMonto(plan)>0){DB.pagosMembresia=DB.pagosMembresia||[];DB.pagosMembresia.push({id:uid('pm'),colegioId:id,fecha:hoy(),plan,modalidad:t==='mensual'?'mensual':'unico',monto:planMonto(plan),tipo:'cambio_plan',atrasado:false});}
  save();closeModal();toast('✅ Membresía cambiada a '+plan);go(state.view);
}

async function verCredenciales(id){
  toast('Buscando cuenta…');
  try{
    const s=await usersCol().where('colegioId','==',id).get();
    const admins=s.docs.map(d=>({uid:d.id,...d.data()})).filter(u=>u.rol==='admin');
    if(!admins.length)return toast('No se encontró la cuenta de acceso');
    const u=admins[0];
    modal(`<div class="modal-head"><h2>Acceso del colegio</h2><button class="iconbtn" style="background:#eef2ff;color:var(--brand)" onclick="closeModal()">✕</button></div>
      <div class="kv"><span>Usuario</span><b>${u.usuario||'—'}</b></div>
      <div class="kv"><span>Clave temporal</span><b>${u.claveTemporal||'(no guardada)'}</b></div>
      <div class="muted" style="font-size:12px;margin:8px 0">Compartí estos datos con el colegio (por WhatsApp). La clave temporal es la última establecida desde este panel.</div>
      <button class="btn sec" onclick="modalCambiarClave('${id}','${u.uid}','${(u.usuario||'').replace(/'/g,'')}')">🔑 Cambiar contraseña</button>`);
  }catch(e){toast('No se pudo leer la cuenta: '+((e&&e.message)||''));}
}
function modalCambiarClave(id,uidU,usuario){
  modal(`<div class="modal-head"><h2>Cambiar contraseña</h2><button class="iconbtn" style="background:#eef2ff;color:var(--brand)" onclick="closeModal()">✕</button></div>
    <div class="kv"><span>Usuario</span><b>${usuario}</b></div>
    <div class="field"><label>Nueva contraseña (mín. 6)</label><input id="pw_new" autocomplete="off"></div>
    <div class="muted" style="font-size:12px;margin-bottom:8px">Se actualiza la contraseña de acceso del colegio.</div>
    <button class="btn" onclick="cambiarClaveColegio('${id}','${uidU}','${usuario}')">Guardar nueva contraseña</button>`);
}
async function cambiarClaveColegio(id,uidU,usuario){
  const nueva=val('pw_new');if(nueva.length<6)return toast('Mínimo 6 caracteres');
  toast('Actualizando…');
  try{
    const d=await usersCol().doc(uidU).get();const prof=d.data()||{};
    const actual=prof.claveTemporal;
    if(!actual)return toast('No hay clave guardada para cambiarla automáticamente. Recreá la cuenta del colegio con "Registrar colegio".');
    const sec=secApp();
    try{
      const cred=await sec.auth().signInWithEmailAndPassword(emailDe(usuario),actual);
      await cred.user.updatePassword(nueva);
      try{await sec.auth().signOut();}catch(e){}
    }catch(err){ try{await secApp().auth().signOut();}catch(e){} return toast('No se pudo cambiar en el servidor (clave actual desconocida). Recreá la cuenta del colegio.'); }
    await usersCol().doc(uidU).set({...prof,claveTemporal:nueva});
    closeModal();toast('✅ Contraseña actualizada');
  }catch(e){toast('Error: '+((e&&e.message)||''));}
}

async function guardarColegio(){
  const nom=val('f_nom');if(!nom)return toast('Ingresá el nombre');
  const usuario=val('f_user').toLowerCase();const pass=val('f_pass');
  if(!usuario||!pass)return toast('Ingresá usuario y clave temporal');
  if(pass.length<6)return toast('La clave debe tener al menos 6 caracteres');
  const plan=val('f_plan');const meta=PLANES[plan]||{};
  const nuevoId=uid('col');let uidNuevo;
  toast('Creando cuenta de acceso…');
  try{
    const sec=secApp();
    const cred=await sec.auth().createUserWithEmailAndPassword(emailDe(usuario),pass);
    uidNuevo=cred.user.uid;
    try{await sec.auth().signOut();}catch(e){}
  }catch(e){
    if(e&&e.code==='auth/email-already-in-use')return toast('Ese usuario ya existe, elegí otro');
    return toast('No se pudo crear el usuario: '+((e&&e.message)||''));
  }
  try{ await usersCol().doc(uidNuevo).set({usuario,nombre:nom,rol:'admin',colegioId:nuevoId,claveTemporal:pass}); }
  catch(e){ return toast('No se pudo guardar el perfil del usuario'); }
  const venc=(meta.tipo==='mensual')?proxVence(null,'mensual'):null;
  DB.colegios.push({id:nuevoId,nombre:nom,plan,membresiaVence:venc,activo:true,bloqueado:false,color:'#1e3a8a',director:'',ciudad:val('f_ciu'),direccion:val('f_dir2'),telefono:val('f_tel'),email:val('f_mail'),logo:null,matricula:150000});
  DB.pagosMembresia=DB.pagosMembresia||[];
  if(meta.monto>0){DB.pagosMembresia.push({id:uid('pm'),colegioId:nuevoId,fecha:hoy(),plan,modalidad:meta.tipo==='unico'?'unico':'mensual',monto:meta.monto,tipo:'alta',atrasado:false});}
  save();closeModal();
  toast('✅ Colegio registrado · usuario: '+usuario);
  go('suscripciones');
}

function venderMembresia(){
  const c=colegio(val('v_col'));if(!c)return toast('Elegí un colegio');
  const plan=val('v_plan'),mod=val('v_mod');const precio=PLAN_PRECIO[plan]||0;
  const base=(c.membresiaVence&&c.membresiaVence>hoy())?new Date(c.membresiaVence):new Date();
  let monto;
  if(mod==='anual'){monto=precio*10;base.setFullYear(base.getFullYear()+1);}
  else{monto=precio;base.setMonth(base.getMonth()+1);}
  const vencManual=val('v_venc');
  c.plan=plan;c.activo=true;c.membresiaVence=vencManual?vencManual:base.toISOString().slice(0,10);
  DB.pagosMembresia=DB.pagosMembresia||[];
  const pago={id:uid('pm'),colegioId:c.id,fecha:hoy(),plan,modalidad:mod,monto};
  DB.pagosMembresia.push(pago);
  save();toast('✅ Pago '+(mod==='anual'?'anual':'mensual')+' registrado · '+money(monto));
  pdfReciboMembresia(c,pago);
  go('membresias');
}

function modalCuenta(){

    <div class="field"><label>Tipo de cuenta</label><select id="cu_tipo" onchange="cuLink()">
      <option value="docente">👩‍🏫 Docente</option>

    </select></div>
    <div class="field" id="cu_linkWrap"></div>
    <div class="field"><label>Usuario (para ingresar)</label><input id="cu_user" placeholder="ej: mariaprof" autocomplete="off"></div>

    <button class="btn" onclick="crearCuentaUsuario()">Crear cuenta</button>`);
  cuLink();

function cuLink(){
  const tipo=val('cu_tipo');const w=document.getElementById('cu_linkWrap');if(!w)return;
  if(tipo==='docente'){
    const ds=q('docentes');
    w.innerHTML=`<label>Docente</label>`+(ds.length?`<select id="cu_link">${ds.map(d=>`<option value="${d.id}">${d.nombre}</option>`).join('')}</select>`:`<div class="muted" style="font-size:12px">No hay docentes. Cargalos primero en Académico → Docentes.</div>`);
  }else{
    const als=q('alumnos');
    w.innerHTML=`<label>Alumno</label>`+(als.length?`<select id="cu_link">${als.map(a=>`<option value="${a.id}">${a.nombre} — ${a.grado}</option>`).join('')}</select>`:`<div class="muted" style="font-size:12px">No hay alumnos. Cargalos primero en Académico → Alumnos.</div>`);
  }
}
async function crearCuentaUsuario(){
  const tipo=val('cu_tipo');const usuario=val('cu_user').toLowerCase();const pass=val('cu_pass');
  if(!usuario||!pass)return toast('Ingresá usuario y contraseña');
  if(pass.length<6)return toast('La contraseña debe tener al menos 6 caracteres');
  const linkEl=document.getElementById('cu_link');if(!linkEl)return toast('Cargá primero docentes/alumnos');
  const perfil={usuario,colegioId:cid()};
  if(tipo==='docente'){const d=docente(linkEl.value);if(!d)return toast('Elegí un docente');perfil.rol='docente';perfil.docenteId=d.id;perfil.nombre=d.nombre;}
  else if(tipo==='alumno'){const a=alumno(linkEl.value);if(!a)return toast('Elegí un alumno');perfil.rol='alumno';perfil.alumnoId=a.id;perfil.nombre=a.nombre;}
  else{const a=alumno(linkEl.value);if(!a)return toast('Elegí un alumno');perfil.rol='familia';perfil.alumnoId=a.id;perfil.nombre=a.tutor||('Familia de '+a.nombre);}
  toast('Creando cuenta…');
  try{
    const sec=secApp();
    const cred=await sec.auth().createUserWithEmailAndPassword(emailDe(usuario),pass);
    await usersCol().doc(cred.user.uid).set(perfil);
    try{await sec.auth().signOut();}catch(e){}
  }catch(e){
    if(e&&e.code==='auth/email-already-in-use')return toast('Ese usuario ya existe, elegí otro');
    return toast('No se pudo crear: '+((e&&e.message)||''));
  }
  closeModal();toast('✅ Cuenta creada: '+usuario);go('usuarios');
}
async function borrarCuenta(uidv){
  if(!confirm('¿Quitar el acceso de este usuario?'))return;
  try{ await usersCol().doc(uidv).delete(); toast('Acceso eliminado'); }catch(e){ toast('No se pudo eliminar'); }
  go('usuarios');
}

/* ============================================================
   TAREAS (deberes) — el docente carga, el alumno ve
   ============================================================ */
function archLinks(arr){return (arr||[]).map(a=>`<a class="filechip" href="${a.data||a.url}" target="_blank" ${a.data?`download="${(a.nombre||'archivo').replace(/"/g,'')}"`:''}>📎 ${a.nombre||'Archivo'}</a>`).join('');}
function yaEntrego(t){return (t.entregas||[]).some(e=>e.alumnoId===session.alumnoId);}
function vTareas(el){
  head('Tareas');
  const esDoc=session.rol==='docente';
  const puedeCrear=esDoc; // solo el docente carga tareas
  let tareas=q('tareas');
  if(session.rol==='alumno'||session.rol==='familia'){const g=alumno(session.alumnoId).grado;tareas=tareas.filter(t=>t.grado===g);}
  else if(esDoc){tareas=tareas.filter(t=>t.docenteId===session.docenteId);}
  tareas=tareas.slice().sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
  const titulo=(session.rol==='alumno'||session.rol==='familia')?'📋 Tareas asignadas':'📋 Tareas';
  el.innerHTML=`<div class="pagetitle">${titulo}</div>
    ${tareas.map(t=>{const m=materia(t.materiaId);const doc=docente(t.docenteId);const venc=t.entrega&&t.entrega<hoy();
      const mias=t.docenteId===session.docenteId;
      const entregado=(session.rol==='alumno'||session.rol==='familia')&&yaEntrego(t);
      const miEntrega=(t.entregas||[]).find(e=>e.alumnoId===session.alumnoId);
      return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:start">
        <div><h3 style="margin:0">${t.titulo}</h3><div class="muted" style="font-size:12px">${m?m.nombre:''} · ${t.grado}${doc?' · '+doc.nombre:''}</div></div>
        <span class="pill ${venc?'bad':'info'}">Entrega ${fmtFecha(t.entrega)}</span></div>
        <p style="margin:8px 0 0;font-size:14px;color:#334155">${t.descripcion||''}</p>
        ${(t.archivos&&t.archivos.length)?`<div style="margin-top:8px">${archLinks(t.archivos)}</div>`:''}
        ${esDoc&&mias?`<div class="muted" style="font-size:12px;margin-top:10px">✅ Entregas: ${(t.entregas||[]).length}</div>
          ${(t.entregas||[]).map(e=>`<div class="filechip" style="background:#f1f5f9;color:#334155">👤 ${e.alumnoNombre||''} · ${fmtFecha(e.fecha)}${e.archivo?' 📎':''}</div>`).join('')}
          <div style="margin-top:8px;display:flex;gap:6px"><button class="btn sm sec" onclick="modalTarea('${t.id}')">✏️ Editar</button><button class="btn sm bad" onclick="borrarTarea('${t.id}')">🗑️</button></div>`:''}
        ${session.rol==='alumno'?(entregado
            ?`<div class="pill ok" style="margin-top:10px;display:inline-block">✓ Entregada el ${fmtFecha(miEntrega.fecha)}</div> <button class="btn sm sec" onclick="modalEntrega('${t.id}')">Volver a publicar</button>`
            :`<div style="margin-top:10px"><button class="btn ok sm" onclick="modalEntrega('${t.id}')">📤 Publicar tarea terminada</button></div>`):''}
        ${session.rol==='familia'?(entregado?`<div class="pill ok" style="margin-top:10px;display:inline-block">✓ Entregada el ${fmtFecha(miEntrega.fecha)}</div>`:`<div class="pill bad" style="margin-top:10px;display:inline-block">Sin entregar</div>`):''}
      </div>`;}).join('')||empty(session.rol==='alumno'?'No tenés tareas pendientes 🎉':'Sin tareas cargadas')}
    ${puedeCrear?`<button class="fab" onclick="modalTarea()">+</button>`:''}`;
}
window._tkArch=[];
function tkAddFiles(inp){const files=[...inp.files];let pend=files.length;
  files.forEach(f=>{ if(f.size>700*1024){toast('"'+f.name+'" supera 700 KB, usá un enlace');pend--;if(!pend)tkRenderArch();return;}
    const r=new FileReader();r.onload=e=>{window._tkArch.push({nombre:f.name,tipo:f.type,data:e.target.result});pend--;if(!pend)tkRenderArch();};
    r.onerror=()=>{pend--;if(!pend)tkRenderArch();};r.readAsDataURL(f);});
  inp.value='';}
function tkAddLink(){const u=val('tk_link');if(!u)return;window._tkArch.push({nombre:(u.split('/').pop()||'Enlace'),url:u});const el=document.getElementById('tk_link');if(el)el.value='';tkRenderArch();}
function tkRenderArch(){const d=document.getElementById('tk_archPrev');if(!d)return;
  d.innerHTML=window._tkArch.map((a,i)=>`<span class="filechip">📎 ${a.nombre} <b onclick="window._tkArch.splice(${i},1);tkRenderArch()" style="cursor:pointer;color:#ef4444">✕</b></span>`).join('');}
function modalTarea(id){
  let mats=q('materias').filter(m=>m.docenteId===session.docenteId);
  if(!mats.length)return toast('No tenés materias asignadas');
  const t=id?DB.tareas.find(x=>x.id===id):null;
  window._tkArch=t&&t.archivos?JSON.parse(JSON.stringify(t.archivos)):[];
  modal(`<div class="modal-head"><h2>${id?'Editar tarea':'Nueva tarea'}</h2><button class="iconbtn" style="background:#eef2ff;color:var(--brand)" onclick="closeModal()">✕</button></div>
    <div class="field"><label>Materia (define el grado)</label><select id="tk_mat">${mats.map(m=>`<option value="${m.id}" data-g="${m.grado}" ${t&&t.materiaId===m.id?'selected':''}>${m.nombre} — ${m.grado}</option>`).join('')}</select></div>
    <div class="field"><label>Título</label><input id="tk_tit" value="${t?(t.titulo||'').replace(/"/g,'&quot;'):''}" placeholder="Ej: Ejercicios de la unidad 3"></div>
    <div class="field"><label>Descripción / consigna</label><textarea id="tk_desc" rows="4">${t?(t.descripcion||''):''}</textarea></div>
    <div class="field"><label>Fecha de entrega</label><input id="tk_ent" type="date" value="${t?(t.entrega||hoy()):hoy()}"></div>
    <div class="field"><label>Archivos adjuntos (PDF u otros, máx 700 KB c/u)</label>
      <input id="tk_file" type="file" multiple onchange="tkAddFiles(this)">
      <div style="display:flex;gap:6px;margin-top:8px"><input id="tk_link" placeholder="…o pegá un enlace (Drive, etc.)" style="flex:1"><button class="btn sm sec" style="width:auto;padding:0 12px" onclick="tkAddLink()">Agregar enlace</button></div>
      <div id="tk_archPrev" style="margin-top:8px"></div></div>
    <button class="btn" onclick="guardarTarea('${id||''}')">${id?'Guardar':'Publicar tarea'}</button>`);
  tkRenderArch();
}
function guardarTarea(id){
  const tit=val('tk_tit');if(!tit)return toast('Ingresá el título');
  const s=document.getElementById('tk_mat');const mid=s.value;const grado=s.selectedOptions[0].dataset.g;
  const m=materia(mid);
  if(id){const t=DB.tareas.find(x=>x.id===id);if(!t)return;
    Object.assign(t,{materiaId:mid,grado,titulo:tit,descripcion:val('tk_desc'),entrega:val('tk_ent'),archivos:window._tkArch.slice()});}
  else DB.tareas.push({id:uid('t'),colegioId:cid(),materiaId:mid,grado,docenteId:(session.docenteId||(m&&m.docenteId)),titulo:tit,descripcion:val('tk_desc'),fecha:hoy(),entrega:val('tk_ent'),archivos:window._tkArch.slice(),entregas:[]});
  window._tkArch=[];save();closeModal();toast(id?'Tarea actualizada':'✅ Tarea publicada para los alumnos');go('tareas');
}
function borrarTarea(id){confirmar('¿Eliminar esta tarea?',()=>{DB.tareas=DB.tareas.filter(t=>t.id!==id);save();closeModal();toast('Tarea eliminada');go('tareas');});}
window._entArch=null;
function enAddFile(inp){const f=inp.files[0];if(!f)return;
  if(f.size>700*1024){toast('El archivo supera 700 KB, usá un enlace');inp.value='';return;}
  const r=new FileReader();r.onload=e=>{window._entArch={nombre:f.name,tipo:f.type,data:e.target.result};const d=document.getElementById('en_prev');if(d)d.innerHTML=`<span class="filechip">📎 ${f.name}</span>`;};r.readAsDataURL(f);}
function modalEntrega(tid){
  window._entArch=null;
  const t=DB.tareas.find(x=>x.id===tid);
  modal(`<div class="modal-head"><h2>Publicar tarea terminada</h2><button class="iconbtn" style="background:#eef2ff;color:var(--brand)" onclick="closeModal()">✕</button></div>
    <div class="muted" style="font-size:13px;margin-bottom:8px">${t?t.titulo:''}</div>
    <div class="field"><label>Comentario (opcional)</label><textarea id="en_com" rows="3" placeholder="Ej: entregué el trabajo completo"></textarea></div>
    <div class="field"><label>Adjuntar archivo (opcional, máx 700 KB)</label><input type="file" onchange="enAddFile(this)"><div id="en_prev" style="margin-top:6px"></div></div>
    <button class="btn ok" onclick="guardarEntrega('${tid}')">📤 Publicar como terminada</button>`);
}
function guardarEntrega(tid){
  const t=DB.tareas.find(x=>x.id===tid);if(!t)return;
  const al=alumno(session.alumnoId);
  t.entregas=(t.entregas||[]).filter(e=>e.alumnoId!==session.alumnoId);
  t.entregas.push({alumnoId:session.alumnoId,alumnoNombre:al?al.nombre:'',fecha:hoy(),comentario:val('en_com')||'',archivo:window._entArch||null});
  window._entArch=null;save();closeModal();toast('✅ Tarea publicada como terminada');go('tareas');
}

function modalBoletinTarea(id){
  const x=id?DB.boletinTarea.find(y=>y.id===id):null;

  if(session.rol==='docente'){const gs=[...new Set(DB.materias.filter(m=>m.docenteId===session.docenteId&&m.colegioId===cid()).map(m=>m.grado))];als=als.filter(a=>gs.includes(a.grado));}

}
function guardarBoletinTarea(id){
  const aid=val('bt_al'),act=val('bt_act');if(!act)return toast('Ingresá la actividad');
  let nota=Math.round(parseFloat(val('bt_nota')));if(isNaN(nota))return toast('Ingresá la nota');
  if(nota<1)nota=1;if(nota>5)nota=5;
  const mot=val('bt_mot');
  if(id){const x=DB.boletinTarea.find(y=>y.id===id);if(!x)return;Object.assign(x,{alumnoId:aid,actividad:act,nota,motivo:mot});}
  else DB.boletinTarea.push({id:uid('bt'),colegioId:cid(),alumnoId:aid,actividad:act,nota,motivo:mot,fecha:hoy(),autor:session.nombre});

function modalObservacion(aid,obsId){

function guardarObservacion(obsId){
  const aid=val('ob_al');if(!aid)return toast('Elegí un alumno');
  const tit=val('ob_tit');if(!tit)return toast('Ingresá un título');
  if(obsId){const o=DB.observaciones.find(x=>x.id===obsId);if(!o)return;
    Object.assign(o,{alumnoId:aid,tipo:val('ob_tipo'),calificacion:val('ob_cal'),titulo:tit,detalle:val('ob_det')});
    save();closeModal();toast('Observación actualizada');}
  else{DB.observaciones.push({id:uid('ob'),colegioId:cid(),alumnoId:aid,tipo:val('ob_tipo'),calificacion:val('ob_cal'),titulo:tit,detalle:val('ob_det'),fecha:hoy(),autor:session.nombre});
    save();closeModal();toast('⚠️ Observación registrada · los padres serán notificados');}
  go(state.view);
}

async function crearSuperUsuario(){
  const usuario=val('su_user').toLowerCase(),pass=val('su_pass');
  if(!usuario||!pass)return toast('Ingresá usuario y contraseña');
  if(pass.length<6)return toast('La contraseña debe tener al menos 6 caracteres');
  toast('Creando…');
  try{
    const sec=secApp();
    const cred=await sec.auth().createUserWithEmailAndPassword(emailDe(usuario),pass);
    await usersCol().doc(cred.user.uid).set({usuario,nombre:val('su_nom')||usuario.toUpperCase(),rol:'superadmin',colegioId:null});

function colName(){return colegio()?colegio().nombre:'el colegio';}
function waTel(tel,msg){window.open('https://wa.me/'+String(tel||'').replace(/\D/g,'')+'?text='+encodeURIComponent(msg),'_blank');}
function waAlumno(id){const a=alumno(id);const notas=DB.notas.filter(n=>n.alumnoId===id);
  const prom=promedio(notas.map(n=>n.nota));
  waTel(a.telefono,`Hola ${a.tutor}, le escribimos de ${colName()} sobre ${a.nombre} (${a.grado}). Promedio actual: ${prom}.`);}
function waCuotas(id){const a=alumno(id);const imp=DB.mensualidades.filter(m=>m.alumnoId===id&&!m.pagado);
  const tot=imp.reduce((s,m)=>s+m.monto,0);const meses=imp.map(m=>MESES[m.mes]).join(', ');
  waTel(a.telefono,`Hola ${a.tutor}, le recordamos de ${colName()} que ${a.nombre} tiene cuotas pendientes (${meses}) por un total de ${money(tot)}. ¡Gracias!`);}
function waPagoFamilia(id){const a=alumno(id);waTel((colegio()&&colegio().telefono)||'549',`Hola, soy ${a.tutor}, tutor de ${a.nombre} (${a.grado}). Quiero consultar sobre el pago de la cuota.`);}
function waComunicado(id){const c=DB.comunicados.find(x=>x.id===id);
  waTel('',`*${c.titulo}*\n${colName()}\n\n${c.cuerpo}`);}
function waEstadoCuenta(aid){
  const a=alumno(aid);
  const imp=DB.mensualidades.filter(m=>m.alumnoId===aid&&!m.pagado);
  const total=imp.reduce((s,m)=>s+m.monto,0);
  const meses=imp.map(m=>MESES[m.mes]).join(', ')||'ninguna';
  const mat=a.matriculaPagada?'pagada ✅':('pendiente ('+money(matriculaMonto())+')');
  const msg=`*${colName()}* — Estado de cuenta\n\n`+
    `Alumno: ${a.nombre} (${a.grado})\n`+
    `Matrícula: ${mat}\n`+
    `Cuotas impagas: ${meses}\n`+
    `Total adeudado: *${money(total)}*\n\n`+
    `Ante cualquier consulta, quedamos a disposición. ¡Gracias!`;
  waTel(a.telefono,msg);
}
function waReporteCaja(){
  const mov=q('caja');
  const ing=mov.filter(x=>x.tipo==='ingreso').reduce((s,x)=>s+x.monto,0);
  const egr=mov.filter(x=>x.tipo==='egreso').reduce((s,x)=>s+x.monto,0);
  const deuda=calcDeudaTotal();
  const msg=`*${colName()}* — Reporte de caja ${fmtFecha(hoy())}\n\n`+
    `🟢 Ingresos: ${money(ing)}\n`+
    `🔴 Egresos: ${money(egr)}\n`+
    `💰 Saldo: *${money(ing-egr)}*\n`+
    `📌 Por cobrar: ${money(deuda)}`;
  waTel((colegio()&&colegio().telefono)||'',msg);
}

/* ============================================================
   MINI-PDF (generador propio, sin librerías, 100% offline)
   Emula el subconjunto de jsPDF que usamos. Coordenadas en mm.
   ============================================================ */
function jpegSize(bin){
  // devuelve {w,h} leyendo el marcador SOF de un JPEG (string binario)
  let i=2;const len=bin.length;
  while(i<len-8){
    if(bin.charCodeAt(i)!==0xFF){i++;continue;}
    const m=bin.charCodeAt(i+1);
    if(m>=0xC0&&m<=0xCF&&m!==0xC4&&m!==0xC8&&m!==0xCC){
      const h=(bin.charCodeAt(i+5)<<8)|bin.charCodeAt(i+6);
      const w=(bin.charCodeAt(i+7)<<8)|bin.charCodeAt(i+8);
      return {w,h};
    }
    const seg=(bin.charCodeAt(i+2)<<8)|bin.charCodeAt(i+3);
    if(seg<2)break;
    i+=2+seg;
  }
  return {w:0,h:0};
}
function makeDoc(landscape){
  const K=72/25.4, PW=landscape?297:210, PH=landscape?210:297; // A4 mm
  const ops=[]; // graphics operators (content stream)
  const imgs=[]; // imágenes XObject (JPEG)
  let fillC=[0,0,0], textC=[0,0,0], stroke=[0.6,0.6,0.6], size=12, bold=false;
  const esc=s=>String(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
  const yb=y=>(PH-y)*K; // flip Y (baseline)
  const rgb=(r,g,b)=>[r/255,(g==null?r:g)/255,(b==null?r:b)/255];
  return {
    setFillColor(r,g,b){fillC=rgb(r,g,b);},   // color de figuras (rect)
    setTextColor(r,g,b){textC=rgb(r,g,b);},    // color de texto (independiente)
    setDrawColor(r,g,b){stroke=rgb(r,g,b);},
    setFontSize(n){size=n;},
    setFont(_f,style){bold=(style==='bold');},
    rect(x,y,w,h,style){ // 'F' filled
      ops.push(`${fillC[0].toFixed(3)} ${fillC[1].toFixed(3)} ${fillC[2].toFixed(3)} rg`);
      ops.push(`${(x*K).toFixed(2)} ${((PH-(y+h))*K).toFixed(2)} ${(w*K).toFixed(2)} ${(h*K).toFixed(2)} re f`);
    },
    line(x1,y1,x2,y2){
      ops.push(`${stroke[0].toFixed(3)} ${stroke[1].toFixed(3)} ${stroke[2].toFixed(3)} RG 0.4 w`);
      ops.push(`${(x1*K).toFixed(2)} ${yb(y1).toFixed(2)} m ${(x2*K).toFixed(2)} ${yb(y2).toFixed(2)} l S`);
    },
    text(str,x,y){
      const f=bold?'F2':'F1';
      ops.push('BT '+`${textC[0].toFixed(3)} ${textC[1].toFixed(3)} ${textC[2].toFixed(3)} rg`+
        ` /${f} ${size} Tf 1 0 0 1 ${(x*K).toFixed(2)} ${yb(y).toFixed(2)} Tm (${esc(str)}) Tj ET`);
    },
    // Inserta una imagen JPEG (dataURL) en (x,y = esquina superior izq, mm) con tamaño w×h mm
    addImageJPEG(dataUrl,x,y,w,h){
      if(!dataUrl||dataUrl.indexOf('data:image/jpeg')!==0)return;
      const bin=atob(dataUrl.split(',')[1]);
      const sz=jpegSize(bin); if(!sz.w||!sz.h)return;
      const name='Im'+(imgs.length+1);
      imgs.push({name,bin,w:sz.w,h:sz.h});
      ops.push(`q ${(w*K).toFixed(2)} 0 0 ${(h*K).toFixed(2)} ${(x*K).toFixed(2)} ${((PH-(y+h))*K).toFixed(2)} cm /${name} Do Q`);
    },
    save(filename){
      const content=ops.join('\n');
      const objs=[];
      const nImg=imgs.length, imgStart=7;
      const xobj=nImg?(' /XObject << '+imgs.map((im,i)=>`/${im.name} ${imgStart+i} 0 R`).join(' ')+' >>'):'';
      objs[1]='<< /Type /Catalog /Pages 2 0 R >>';
      objs[2]='<< /Type /Pages /Kids [3 0 R] /Count 1 >>';
      objs[3]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${(PW*K).toFixed(2)} ${(PH*K).toFixed(2)}] /Resources << /Font << /F1 5 0 R /F2 6 0 R >>${xobj} >> /Contents 4 0 R >>`;
      objs[4]=`<< /Length ${content.length} >>\nstream\n${content}\nendstream`;
      objs[5]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
      objs[6]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
      imgs.forEach((im,i)=>{objs[imgStart+i]=`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bin.length} >>\nstream\n${im.bin}\nendstream`;});
      let pdf='%PDF-1.4\n';
      const off=[0];
      for(let i=1;i<objs.length;i++){off[i]=pdf.length;pdf+=`${i} 0 obj\n${objs[i]}\nendobj\n`;}
      const xref=pdf.length;
      pdf+=`xref\n0 ${objs.length}\n0000000000 65535 f \n`;
      for(let i=1;i<objs.length;i++)pdf+=String(off[i]).padStart(10,'0')+' 00000 n \n';
      pdf+=`trailer\n<< /Size ${objs.length} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
      // latin1 bytes (soporta acentos español vía WinAnsi)
      const bytes=new Uint8Array(pdf.length);
      for(let i=0;i<pdf.length;i++)bytes[i]=pdf.charCodeAt(i)&0xff;
      // En la APK Android usamos el puente nativo para guardar en Descargas
      if(window.AndroidPDF&&window.AndroidPDF.save){
        let bin='';for(let i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);
        window.AndroidPDF.save(filename, btoa(bin));
        return;
      }
      // En navegador web: descarga normal
      const blob=new Blob([bytes],{type:'application/pdf'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();
      setTimeout(()=>{a.remove();URL.revokeObjectURL(url);},1500);
    }
  };
}

function pdfHeader(doc,titulo){
  const c=colegio();
  doc.setFillColor(30,58,138);doc.rect(0,0,210,28,'F');
  let tx=14;
  if(c&&c.logo){
    try{
      doc.setFillColor(255,255,255);doc.rect(12,4,20,20,'F'); // recuadro blanco
      doc.addImageJPEG(c.logo,13,5,18,18);
      tx=37;
    }catch(e){}
  }
  doc.setTextColor(255);doc.setFontSize(15);doc.setFont(undefined,'bold');
  doc.text((c?c.nombre:'KEVANIX').slice(0,40),tx,12);
  doc.setFontSize(11);doc.setFont(undefined,'normal');doc.text(titulo,tx,21);
  doc.setTextColor(0);
}

function pdfBoletin(id){
  const a=alumno(id)||{};const c=colegio()||{};const doc=makeDoc(true);
  try{ if(typeof ESCUDO_PY==='string') doc.addImageJPEG(ESCUDO_PY,89,52,118,118); }catch(e){}
  const PW=297,KK=72/25.4;
  const wmm=(s,sz,b)=>(String(s).length*(b?0.56:0.52)*sz)/KK;
  const cen=(s,y,sz,b,cx)=>{doc.setFontSize(sz);doc.setFont(undefined,b?'bold':'normal');doc.text(String(s),Math.max(6,(cx||PW/2)-wmm(s,sz,b)/2),y);};
  const mats=DB.materias.filter(m=>m.colegioId===c.id&&m.grado===a.grado);
  const etapas=['1er Periodo','2do Periodo','3er Periodo'];
  const notaDe=(mid,per)=>{const n=DB.notas.find(x=>x.alumnoId===id&&x.materiaId===mid&&x.periodo===per);return n?n.nota:null;};
  const finalDe=(mid)=>{const v=etapas.map(e=>notaDe(mid,e)).filter(x=>x!=null);return v.length?Math.round(v.reduce((s,x)=>s+x,0)/v.length):null;};
  let y=14;
  cen((c.nombre||'Institución Educativa').toUpperCase(),y,15,true);y+=7;
  cen('BOLETÍN DE CALIFICACIONES E INFORMES DESCRIPTIVOS',y,13,true);y+=6;
  cen('Ministerio de Educación y Ciencias · Educación Escolar Básica (Paraguay)',y,9,false);y+=11;
  doc.setFontSize(11);
  const kvp=(k,v,x,vx)=>{doc.setFont(undefined,'bold');doc.text(k,x,y);doc.setFont(undefined,'normal');doc.text(String(v||''),vx,y);};
  kvp('Alumno/a:',a.nombre,14,42); kvp('Grado:',a.grado,150,168); kvp('Año:',String(new Date().getFullYear()),214,228); y+=7;
  kvp('Institución:',c.nombre,14,47); kvp('Ciudad:',c.ciudad,150,172); y+=9;
  // ---- tabla áreas × etapas ----
  const ex=[12,110,135,160,185,215,250,285];
  const heads=['','1ra Etapa','2da Etapa','3ra Etapa','Calificación Final','Complementario','Regularización'];
  const cx=i=>(ex[i]+ex[i+1])/2;
  const ty=y,hh=12,rh=8.4;
  doc.setFillColor(232,238,250);doc.rect(12,ty,273,hh,'F');
  doc.setFont(undefined,'bold');doc.setFontSize(9);doc.text("ÁREAS · Mbo'epykuéra",15,ty+7.5);
  for(let i=1;i<7;i++)cen(heads[i],ty+7.5,8,true,cx(i));
  let ry=ty+hh;
  mats.forEach(m=>{
    doc.setFont(undefined,'normal');doc.setFontSize(8.5);doc.text((m.nombre||'').toUpperCase().slice(0,50),15,ry+5.6);
    [notaDe(m.id,etapas[0]),notaDe(m.id,etapas[1]),notaDe(m.id,etapas[2]),finalDe(m.id),null,null].forEach((v,i)=>{if(v!=null)cen(String(v),ry+5.6,i===3?11:10,i===3,cx(i+1));});
    ry+=rh;
  });
  if(!mats.length){doc.setFontSize(9);doc.text('Sin calificaciones cargadas para este grado.',16,ry+5.6);ry+=rh;}
  doc.setDrawColor(120);
  doc.line(12,ty,285,ty);doc.line(12,ty+hh,285,ty+hh);
  for(let r=1;r<=Math.max(mats.length,1);r++)doc.line(12,ty+hh+r*rh,285,ty+hh+r*rh);
  ex.forEach(x=>doc.line(x,ty,x,ry));
  y=ry+9;
  // ---- resumen ----
  const finals=mats.map(m=>finalDe(m.id)).filter(v=>v!=null);
  const total=finals.reduce((s,v)=>s+v,0);
  const term=finals.length?(total/finals.length).toFixed(2):'—';
  const pasa=finals.length?(Number(term)>=NOTA_APRUEBA?'SÍ':'NO'):'—';
  doc.setFontSize(10.5);
  doc.setFont(undefined,'bold');doc.text('Total de puntos:',14,y);doc.setFont(undefined,'normal');doc.text(String(finals.length?total:'—'),62,y);
  doc.setFont(undefined,'bold');doc.text('Término medio general:',108,y);doc.setFont(undefined,'normal');doc.text(String(term),170,y);
  doc.setFont(undefined,'bold');doc.text('Pasa de grado:',205,y);doc.setFont(undefined,'normal');doc.text(pasa,242,y);y+=9;
  const faltas=DB.asistencia.filter(x=>x.alumnoId===id&&x.estado==='ausente').length;
  doc.setFontSize(9);doc.setFont(undefined,'bold');doc.text('Asistencia (faltas):',14,y);doc.setFont(undefined,'normal');doc.text(String(faltas),54,y);y+=8;
  doc.setFont(undefined,'bold');doc.text('Observaciones:',14,y);y+=5;doc.setDrawColor(205);doc.line(14,y,285,y);y+=6;doc.line(14,y,285,y);
  // ---- firmas ----
  const sy=190;
  doc.setDrawColor(120);doc.line(30,sy,92,sy);doc.line(118,sy,180,sy);doc.line(208,sy,270,sy);
  cen('Profesor/a',sy+5,9,false,61);cen('Director/a',sy+5,9,false,149);cen('Madre, Padre o Encargado',sy+5,9,false,239);
  doc.setFontSize(8);doc.setTextColor(120);doc.text('Escala MEC 1 a 5 · aprueba desde '+NOTA_APRUEBA+' · '+colName()+' · '+fmtFecha(hoy()),14,204);doc.setTextColor(0);
  doc.save('Boletin_'+(a.nombre||'alumno').replace(/ /g,'_')+'.pdf');
  toast('📄 Boletín generado');
}

function pdfBoletinGen(id,fuente,titulo,prefijo){
  const doc=makeDoc();
  const a=alumno(id);const notas=fuente.filter(n=>n.alumnoId===id);
  pdfHeader(doc,titulo);
  doc.setFontSize(12);let y=40;
  doc.setFont(undefined,'bold');doc.text('Alumno: ',14,y);doc.setFont(undefined,'normal');doc.text(a.nombre,40,y);y+=7;
  doc.setFont(undefined,'bold');doc.text('Grado: ',14,y);doc.setFont(undefined,'normal');doc.text(a.grado,40,y);y+=7;
  doc.setFont(undefined,'bold');doc.text('Fecha: ',14,y);doc.setFont(undefined,'normal');doc.text(fmtFecha(hoy()),40,y);y+=12;
  doc.setFillColor(240,244,255);doc.rect(14,y-6,182,9,'F');
  doc.setFont(undefined,'bold');doc.setFontSize(9);
  doc.text('MATERIA',15,y);doc.text('DOCENTE',66,y);doc.text('PERÍODO',118,y);doc.text('NOTA',146,y);doc.text('CONCEPTO',160,y);y+=9;
  doc.setFont(undefined,'normal');
  const notaCorta={5:'Muy bueno',4:'Bueno',3:'Regular',2:'Poco sat.',1:'Reprob.'};
  let suma=0;notas.forEach(n=>{const m=materia(n.materiaId);
    doc.text((m?m.nombre:'').slice(0,27),15,y);
    doc.text(docenteDeMateria(n.materiaId).slice(0,26),66,y);
    doc.text(n.periodo,118,y);
    doc.text(String(n.nota),150,y);doc.text(notaCorta[n.nota]||'',160,y);
    doc.setDrawColor(230);doc.line(14,y+2,196,y+2);y+=8;suma+=n.nota;});
  y+=4;doc.setFont(undefined,'bold');doc.setFontSize(12);
  const prom=notas.length?(suma/notas.length).toFixed(2):'—';
  doc.text('Promedio general: '+prom,14,y);
  if(notas.length){doc.text('Situación: '+(Number(prom)>=NOTA_APRUEBA?'Aprobado':'No aprobado'),120,y);}
  y+=8;doc.setFont(undefined,'normal');doc.setFontSize(8);doc.setTextColor(120);
  doc.text('Escala MEC Paraguay: 5 Muy bueno/Excelente, 4 Bueno/Satisfactorio, 3 Regular/Aceptable, 2 Poco satisfactorio, 1 Reprobado. Aprueba desde '+NOTA_APRUEBA+'.',14,y);
  doc.setFontSize(9);doc.setTextColor(120);doc.text('Documento generado por '+colName()+' · '+fmtFecha(hoy()),14,285);
  doc.save(prefijo+'_'+a.nombre.replace(/ /g,'_')+'.pdf');toast('📄 Boletín PDF generado');
}
function pdfDeuda(){
  const doc=makeDoc();
  pdfHeader(doc,'Reporte de deuda / morosidad');
  let y=40;doc.setFontSize(11);doc.text('Fecha: '+fmtFecha(hoy()),14,y);y+=10;
  doc.setFillColor(240,244,255);doc.rect(14,y-6,182,9,'F');doc.setFont(undefined,'bold');doc.setFontSize(10);
  doc.text('ALUMNO',16,y);doc.text('GRADO',110,y);doc.text('CUOTAS',145,y);doc.text('DEUDA',172,y);y+=9;
  doc.setFont(undefined,'normal');let total=0;
  q('alumnos').forEach(a=>{const imp=DB.mensualidades.filter(m=>m.alumnoId===a.id&&!m.pagado);
    if(!imp.length)return;const t=imp.reduce((s,m)=>s+m.monto,0);total+=t;
    doc.text(a.nombre,16,y);doc.text(a.grado,110,y);doc.text(String(imp.length),150,y);doc.text(moneyG(t),170,y);
    doc.setDrawColor(230);doc.line(14,y+2,196,y+2);y+=8;});
  y+=4;doc.setFont(undefined,'bold');doc.setFontSize(13);doc.setTextColor(200,30,30);
  doc.text('TOTAL POR COBRAR: '+moneyG(total),14,y);
  doc.save('Reporte_Deuda_'+hoy()+'.pdf');toast('📄 Reporte de deuda generado');
}

  doc.setFillColor(240,244,255);doc.rect(14,y-6,182,9,'F');doc.setFont(undefined,'bold');doc.setFontSize(10);
  doc.text('CONCEPTO',16,y);doc.text('TIPO',130,y);doc.text('MONTO',170,y);y+=9;doc.setFont(undefined,'normal');
  let ing=0,egr=0;

/* -------- Número a letras (para la boleta) -------- */
function numeroALetras(n){
  n=Math.round(Number(n)||0);
  if(n===0)return 'cero';
  const uni=['','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte'];
  const dec=['','','veinte','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
  const cen=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
  function tres(x){
    if(x===0)return '';
    if(x===100)return 'cien';
    let s='';const c=Math.floor(x/100),r=x%100;
    if(c)s+=cen[c]+(r?' ':'');
    if(r<=20)s+=uni[r];
    else{const d=Math.floor(r/10),u=r%10;
      if(d===2)s+=u?'veinti'+uni[u]:'veinte';
      else s+=dec[d]+(u?' y '+uni[u]:'');}
    return s.trim();
  }
  let s='';
  const mill=Math.floor(n/1000000),miles=Math.floor((n%1000000)/1000),resto=n%1000;
  if(mill){s+=(mill===1?'un millón':tres(mill)+' millones');if(miles||resto)s+=' ';}
  if(miles){s+=(miles===1?'mil':tres(miles)+' mil');if(resto)s+=' ';}
  if(resto)s+=tres(resto);
  return s.trim();
}

/* -------- Boleta / recibo de pago (matrícula o cuota) -------- */
const MESES_LARGO=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function wrapTxt(str,max){const w=String(str||'').split(' ');const out=[];let cur='';w.forEach(word=>{if((cur+' '+word).trim().length>max){if(cur)out.push(cur);cur=word;}else{cur=(cur+' '+word).trim();}});if(cur)out.push(cur);return out;}
function capFirst(s){s=String(s||'');return s.charAt(0).toUpperCase()+s.slice(1);}
function pdfBoleta(aid,concepto,monto){
  const a=alumno(aid)||{};const c=colegio()||{};const doc=makeDoc();
  const KK=72/25.4;
  const wmm=(s,sz,bold)=>(String(s).length*(bold?0.56:0.52)*sz)/KK;
  const cen=(s,y,sz,bold)=>{doc.setFontSize(sz);doc.setFont(undefined,bold?'bold':'normal');doc.text(s,Math.max(14,(210-wmm(s,sz,bold))/2),y);};
  const dbl=(y)=>{doc.setDrawColor(30,58,138);doc.line(14,y,196,y);doc.line(14,y+1.3,196,y+1.3);};
  const sng=(y)=>{doc.setDrawColor(160);doc.line(14,y,196,y);};
  const nro='001-001-'+String(nuevoRecibo()).padStart(6,'0');
  const d=new Date();
  const fechaLarga=(c.ciudad||'............')+', '+d.getDate()+' de '+MESES_LARGO[d.getMonth()]+' de '+d.getFullYear();
  let y=24;
  dbl(y);y+=12;
  cen((c.nombre||'Institución Educativa').toUpperCase(),y,19,true);y+=10;
  cen('RUC: '+(c.ruc||'.......................'),y,13,true);y+=7.5;
  cen('Distrito: '+(c.ciudad||'.................')+' - Paraguay',y,13,true);y+=7.5;
  cen(fechaLarga,y,13,true);y+=9;
  dbl(y);y+=12;
  doc.setFont(undefined,'bold');doc.setFontSize(12);doc.text('RECIBO DE DINERO',16,y);
  doc.text('N°: '+nro,118,y);y+=13;
  doc.setFillColor(240,244,255);doc.rect(14,y-6,182,12,'F');
  doc.setFont(undefined,'bold');doc.setFontSize(14);doc.text('VALOR: '+moneyG(monto),18,y+2);y+=18;
  doc.setFontSize(11);
  doc.setFont(undefined,'bold');doc.text('Recibí(mos) del Sr./Sra.:',16,y);doc.setFont(undefined,'normal');doc.text(a.tutor||'..............................................',68,y);y+=8;
  doc.setFont(undefined,'bold');doc.text('La cantidad de Guaraníes:',16,y);doc.setFont(undefined,'normal');y+=6;
  wrapTxt(capFirst(numeroALetras(monto)),96).forEach(l=>{doc.text(l,16,y);y+=5.5;});
  y+=4;
  doc.setFont(undefined,'bold');doc.text('En concepto de:',16,y);doc.setFont(undefined,'normal');doc.text(concepto||'',56,y);y+=8;
  doc.setFont(undefined,'bold');doc.text('Nombre del Alumno/a:',16,y);doc.setFont(undefined,'normal');doc.text(a.nombre||'',62,y);y+=8;
  doc.setFont(undefined,'bold');doc.text('Grado/Curso:',16,y);doc.setFont(undefined,'normal');doc.text(a.grado||'................',43,y);
  doc.setFont(undefined,'bold');doc.text('Turno:',120,y);doc.setFont(undefined,'normal');doc.text(a.turno||'..............',135,y);y+=8;
  doc.setFont(undefined,'bold');doc.text('Forma de Pago:',16,y);doc.setFont(undefined,'normal');doc.text('[   ] Efectivo       [   ] Transferencia / Giro',60,y);y+=9;
  sng(y);y+=6;
  doc.setFont(undefined,'bold');doc.setFontSize(10);doc.text('NOTA IMPORTANTE:',16,y);doc.setFont(undefined,'normal');doc.setFontSize(9);y+=6;
  if(c.notaLegal){wrapTxt(c.notaLegal,108).forEach(l=>{doc.text(l,16,y);y+=5;});}
  else{doc.setDrawColor(205);doc.line(16,y,194,y);y+=6;doc.line(16,y,194,y);y+=6;}
  y+=2;sng(y);y+=24;
  doc.setDrawColor(120);doc.line(26,y,88,y);doc.line(122,y,184,y);y+=5;
  doc.setFontSize(9);cenBetween(doc,26,88,'Firma y Aclaración',y);cenBetween(doc,122,184,'Firma y Aclaración',y);y+=5;
  doc.setFont(undefined,'bold');cenBetween(doc,26,88,'Secretario/a',y,true);cenBetween(doc,122,184,'Director/a',y,true);
  doc.save('Recibo_'+nro.replace(/-/g,'')+'_'+(a.nombre||'alumno').replace(/ /g,'_')+'.pdf');
  toast('🧾 Recibo N° '+nro+' generado');
}
function cenBetween(doc,x1,x2,str,y,bold){const KK=72/25.4;doc.setFont(undefined,bold?'bold':'normal');const w=(str.length*(bold?0.56:0.52)*(bold?9:9))/KK;doc.text(str,(x1+x2)/2-w/2,y);}
