<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KEVANIX — Sin conexión</title>
<style>
  :root{--ink:#e8edff}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(160deg,#0a0e2e,#1e3a8a 60%,#22d3ee);color:var(--ink);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
  .ic{width:74px;height:74px;border-radius:20px;background:#070b22;border:2px solid #22d3ee;display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 16px;box-shadow:0 0 30px #22d3ee66}
  h1{font-size:21px;margin:0 0 8px}
  p{opacity:.85;font-size:14.5px;line-height:1.5;max-width:320px;margin:0 auto 22px}
  button{background:#fff;color:#1e2a5e;border:none;border-radius:14px;padding:14px 26px;font-size:15px;font-weight:700}
</style>
</head>
<body>
  <div>
    <div class="ic">📡</div>
    <h1>Sin conexión a internet</h1>
    <p>KEVANIX necesita internet para sincronizar los datos del colegio. Revisá el Wi-Fi o los datos móviles y volvé a intentar.</p>
    <button onclick="location.href='https://educativo.kevanix.com/'">Reintentar</button>
  </div>
</body>
</html>
